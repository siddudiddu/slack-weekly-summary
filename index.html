<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Slack Summary</title>
<style>
  :root{
    --c-red:#D85A30; --c-red-bg:#FAECE7; --c-red-text:#712B13;
    --c-amber:#BA7517; --c-amber-bg:#FAEEDA; --c-amber-text:#633806;
    --c-green:#3B6D11; --c-green-bg:#EAF3DE; --c-green-text:#27500A;
    --c-blue:#185FA5; --c-blue-bg:#E6F1FB; --c-blue-text:#0C447C;
    --c-purple:#534AB7; --c-purple-bg:#EEEDFE; --c-purple-text:#3C3489;
    --c-teal:#0F6E56; --c-teal-bg:#E1F5EE; --c-teal-text:#085041;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 16px 60px; background:#f8f7f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#262320;
  }
  .wrap{max-width:960px; margin:0 auto;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .topbar h1{font-size:20px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .topbar .meta{text-align:right; font-size:11px; color:#85807a; line-height:1.5;}
  .topbar .meta .range{font-weight:600; color:#4a453f; font-size:12px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:18px;}
  .kpi{background:#fff; border-radius:10px; padding:12px 14px; border-top:3px solid var(--accent); box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  .kpi .num{font-size:26px; font-weight:700; line-height:1;}
  .kpi .label{font-size:11px; font-weight:600; color:#6b665f; text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .kpi .breakdown{font-size:11px; color:#85807a; margin-top:6px; line-height:1.5;}
  .kpi .fillbar{display:flex; gap:2px; margin-top:8px; height:5px;}
  .kpi .fillbar span{flex:1; border-radius:2px; background:#ece9e4;}
  .kpi .fillbar span.on{background:var(--accent);}

  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .tab-btn{
    border:1px solid #e3e0da; background:#fff; color:#4a453f; font-size:12px; font-weight:600;
    padding:7px 13px; border-radius:999px; cursor:pointer; transition:all .15s;
  }
  .tab-btn:hover{background:#f1efeb;}
  .tab-btn.active{background:#262320; color:#fff; border-color:#262320;}

  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:8px;}
  .card{background:#fff; border:1px solid #ece9e4; border-radius:8px; padding:10px 12px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .card .chrow{display:flex; align-items:center; gap:6px; margin-bottom:4px;}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .chname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:#85807a;}
  .card .title{font-size:12px; font-weight:700; color:#262320; margin:2px 0 3px;}
  .card .desc{font-size:11px; color:#5c5750; line-height:1.5; margin-bottom:8px;}
  .card .desc b{color:#262320;}
  .card .footrow{display:flex; justify-content:space-between; align-items:center;}
  .badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.02em;}
  .badge.urgent{background:var(--c-red-bg); color:var(--c-red-text);}
  .badge.pending{background:var(--c-amber-bg); color:var(--c-amber-text);}
  .badge.watch{background:var(--c-amber-bg); color:var(--c-amber-text);}
  .badge.fyi{background:var(--c-blue-bg); color:var(--c-blue-text);}
  .badge.done{background:var(--c-green-bg); color:var(--c-green-text);}
  .badge.escalate{background:var(--c-purple-bg); color:var(--c-purple-text);}
  .slacklink{font-size:11px; color:#185FA5; text-decoration:none; font-weight:600;}
  .slacklink:hover{text-decoration:underline;}

  .empty-note{font-size:12px; color:#85807a; padding:18px; background:#fff; border:1px dashed #e3e0da; border-radius:8px;}

  .buzz-list{display:grid; gap:8px;}
  .buzz-item{background:#fff; border:1px solid #ece9e4; border-radius:8px; padding:12px 14px;}
  .buzz-item .rank{font-size:11px; font-weight:700; color:var(--c-purple); text-transform:uppercase; letter-spacing:.04em;}
  .buzz-item .htitle{font-size:13px; font-weight:700; margin:3px 0;}
  .buzz-item .hdesc{font-size:12px; color:#5c5750; line-height:1.5;}

  .todo-group{background:#fff; border:1px solid #ece9e4; border-radius:8px; margin-bottom:10px; overflow:hidden;}
  .todo-head{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#fbfaf8; border-bottom:1px solid #ece9e4;}
  .todo-head .ttl{font-size:12px; font-weight:700;}
  .todo-head .chip{font-size:10px; background:#ece9e4; color:#5c5750; border-radius:999px; padding:2px 8px; font-weight:700; margin-left:8px;}
  .todo-head .clearbtn{font-size:11px; color:#85807a; background:none; border:none; cursor:pointer; font-weight:600;}
  .todo-head .clearbtn:hover{color:#262320;}
  .todo-row{display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid #f3f1ed; font-size:12px; cursor:pointer;}
  .todo-row:last-child{border-bottom:none;}
  .todo-row:hover{background:#fbfaf8;}
  .todo-row.dismissed .ttext{text-decoration:line-through; color:#aba59e;}
  .todo-row .ttext{flex:1; padding-right:10px;}
  .age{font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; flex-shrink:0;}
  .age.red{background:var(--c-red-bg); color:var(--c-red-text);}
  .age.faded{background:#f1efeb; color:#aba59e;}
  .todo-empty{padding:14px; font-size:12px; color:#85807a;}
  .vault-note{font-size:12px; background:var(--c-amber-bg); color:var(--c-amber-text); padding:10px 14px; border-radius:8px; margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Daily Slack summary</h1>
    <div class="meta">
      <div class="range" id="dateRange">—</div>
      <div id="refreshedAt">Refreshed —</div>
    </div>
  </div>

  <div class="kpis" id="kpiRow"></div>

  <div class="tabs" id="tabRow"></div>

  <div id="panels"></div>

</div>

<script>
// ---------- Header dates (computed at load) ----------
(function(){
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate()-6);
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('dateRange').textContent = fmt(start) + ' – ' + fmt(now) + ', ' + now.getFullYear();
  document.getElementById('refreshedAt').textContent = 'Refreshed ' + now.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

  {ch:'#bat-project-team', dot:'blue', title:'Org-structure audit follow-up for Ajila\'s team', desc:'Security input from Harjit has come in; Rutvik and Erinn are aligned on doing an internal org-structure audit. Worth a light check-in on whether Siddu still needs to loop back to Ajila.', badge:'watch', link:'https://hootsuite.enterprise.slack.com/archives/C08UP4H0Q65/p1781771357215769'},

  {ch:'#customer-proserv-global', dot:'blue', title:'Adobe Analytics eVar mapping check', desc:'Siddu asked whether anyone has recently set up HSE↔Adobe Analytics for a customer to double-check eVar mapping in the Measure tool — no response yet, low urgency.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C07GHNRP7UH/p1780998697426909'},
  {ch:'#who-owns-it', dot:'blue', title:'Internal Nest data-export PoC — licensing question', desc:'Siddu is running an internal PoC exporting Nest data into a warehouse and asked if an Enterprise license is available rather than hitting free-plan limits.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C1WG06Q6S/p1782128582791379'},
  {ch:'#suite', dot:'blue', title:'A few FYI tags from the team', desc:'Stuart James and Robert Mumby looped Siddu in on general #suite threads this week — no action needed, just visibility.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C0B32HPJ7DG/p1781883999649819'}

  {ch:'#ey-account-team', dot:'green', title:'Metrics-that-matter template progressing well', desc:'Molly Radabaugh updated the "metrics that matter" slide and Stu kicked off a strong teams template — good collaborative momentum heading into the EY workshop.', badge:'done', link:'https://hootsuite.enterprise.slack.com/archives/C09LQ1X4EJG/p1781017058208359'},
  {ch:'#genesis-healthcare', dot:'green', title:'Account issue resolved, relationship intact', desc:'Martina Ondrasekova apologised for a missed item and confirmed it\'s now sorted — clean resolution, no lingering friction.', badge:'done', link:'https://hootsuite.enterprise.slack.com/archives/C0700UC6JG5/p1781078361711849'}

const RELEASES = [
  {ch:'#corp-product-announcements', dot:'purple', title:'Lumen MCP — Claude ↔ Talkwalker integration launched', desc:'New internal MCP lets Claude query Talkwalker listening data directly (mention trends, sentiment, top voices, geo breakdowns). ~5 min setup via Okta on the Team plan; free-plan setup guide also provided.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C025K59FKM0/p1781015807206809'},
  {ch:'#corp-product-announcements', dot:'purple', title:'Deprecation: Retweets removed from X Streams search', desc:'Platform-driven change by X (effective Jun 7) — keyword/topic searches in X Streams now return original posts only. Help Center articles updated; customers should review their search configs.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C025K59FKM0/p1781715468374639'},
  {ch:'#corp-product-announcements', dot:'purple', title:'Calendar approval filter — clarified scope', desc:'Following customer confusion, Product clarified the pending-approval filter targets the assignment bottleneck (not approved/rejected history), and confirmed CSV export covers a full year of approval history.', badge:'fyi', link:'https://hootsuite.enterprise.slack.com/archives/C025K59FKM0/p1781713381563999'},
  {ch:'#corp-product-announcements', dot:'purple', title:'Roadmap timing on Colliers / ZeroFox displacement — Q3 target (soft)', desc:'No firm date yet, but intent is within Q3 — relevant for a renewal where this could shift $100k+ in revenue and ~$55k of ZeroFox spend.', badge:'watch', link:'https://hootsuite.enterprise.slack.com/archives/C025K59FKM0/p1781719036149549'}

// ---------- Render helpers ----------
function renderCards(list){
  if(!list.length) return '<div class="empty-note">Nothing to flag today.</div>';
  return '<div class="cards">' + list.map(c => `
    <div class="card">
      <div class="chrow"><span class="dot" style="background:var(--c-${c.dot})"></span><span class="chname">${c.ch}</span></div>
      <div class="title">${c.title}</div>
      <div class="desc">${c.desc}</div>
      <div class="footrow"><span class="badge ${c.badge}">${labelFor(c.badge)}</span><a class="slacklink" href="${c.link}" target="_blank" rel="noopener">Slack ↗</a></div>
    </div>`).join('') + '</div>';
}
function labelFor(b){
  return {urgent:'Urgent', pending:'Pending', watch:'Watch', fyi:'FYI', done:'Done', escalate:'Escalate?'}[b] || b;
}

const BUZZ = [
  {title:'Claude / MCP adoption is accelerating across PS & TAM teams', desc:'Lumen MCP (Talkwalker via Claude) launched internally; the AI Services Tiger Team is actively testing MCP connectors against client orgs; the Lumen Query Builder app got a huge reception. Claude-built tools are now a recurring theme in delivery work.'},
  {title:'X (Twitter) platform changes rippling into customer conversations', desc:'X removed retweets from search indexing — multiple customer-facing teams are fielding questions about Streams configuration as a result.'},
  {title:'AOS / Suite rollout communications timing', desc:'Coordinating customer comms tiers and meeting timing for the Allen Overy Suite rollout is an active, slightly time-pressured thread this week.'},
  {title:'Talkwalker tooling & source-panel efficiency pushes', desc:'New diagnostic tools, ID-lookup workflows (Riddler) and source-panel templates are being shared and adopted across the TAM/PS team to speed up Talkwalker setup work.'},
  {title:'Org access & permissions scrutiny', desc:'A White & Case social-profile access investigation and a Hootsuite/Adobe Analytics eVar mapping check both point to more attention on org permissioning and data-mapping accuracy this week.'}
];

// ---------- Tabs ----------
const TABS = [
  {id:'needs-action', label:'Needs Action', render:()=>renderCards(NEEDS_ACTION)},
  {id:'monitor', label:'Monitor', render:()=>renderCards(MONITOR)},
  {id:'highlights', label:'Highlights', render:()=>renderCards(HIGHLIGHTS)},
  {id:'saved', label:'Saved Threads', render:()=>'<div class="empty-note">Nothing to flag today — no Slack-saved items have received new replies in the past 7 days. (Checked: Lumen Query Builder thread, White &amp; Case access-investigation thread.)</div>'},
  {id:'buzz', label:'Buzz Topics', render:()=>'<div class="buzz-list">' + BUZZ.map((b,i)=>`<div class="buzz-item"><div class="rank">#${i+1} Trending</div><div class="htitle">${b.title}</div><div class="hdesc">${b.desc}</div></div>`).join('') + '</div>'},
  {id:'releases', label:'Releases', render:()=>renderCards(RELEASES)},
  {id:'new-channels', label:'New Channels', render:()=>'<div class="empty-note">Nothing to flag today — Slack search doesn\'t expose channel-join dates directly, so newly-added channels couldn\'t be reliably detected this run.</div>'},
  {id:'todo', label:'☑ To-Do', render:renderTodo}
];

function renderTodo(){
  return `<div class="vault-note">Your Obsidian vault folder isn't connected to this session, so today's to-do tables couldn't be pulled from Daily Tasks.md / Personal To Do.md. Connect the vault folder and re-run to populate this tab.</div>
    <div id="todoGroups">
      ${todoGroupHtml('starred-recent','⭐ Starred — open ≤ 5 days',[])}
      ${todoGroupHtml('unstarred-recent','Unstarred — open ≤ 5 days',[])}
      ${todoGroupHtml('starred-aged','⭐ Starred — open &gt; 5 days',[])}
      ${todoGroupHtml('unstarred-aged','Unstarred — open &gt; 5 days',[])}
    </div>`;
}
function todoGroupHtml(key, title, items){
  return `<div class="todo-group" data-key="${key}">
    <div class="todo-head">
      <span class="ttl">${title}<span class="chip">${items.length}</span></span>
      <button class="clearbtn" data-clear="${key}">Clear done</button>
    </div>
    <div class="todo-body">${items.length ? items.map((it,i)=>todoRowHtml(key,i,it)).join('') : '<div class="todo-empty">No items.</div>'}</div>
  </div>`;
}
function todoRowHtml(key,i,it){
  return `<div class="todo-row" data-key="${key}" data-idx="${i}"><span class="ttext">${it.text}</span><span class="age ${it.ageClass}">${it.age}</span></div>`;
}

function renderTabs(){
  const tabRow = document.getElementById('tabRow');
  tabRow.innerHTML = TABS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  const panels = document.getElementById('panels');
  panels.innerHTML = TABS.map((t,i)=>`<div class="tabpanel${i===0?' active':''}" id="panel-${t.id}">${t.render()}</div>`).join('');

  tabRow.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabRow.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      panels.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  // todo dismiss + clear-done, using localStorage
  panels.querySelectorAll('.todo-row').forEach(row=>{
    const sk = storeKey(row.dataset.key, row.dataset.idx);
    if(localStorage.getItem(sk)==='1') row.classList.add('dismissed');
    row.addEventListener('click', ()=>{
      row.classList.toggle('dismissed');
      localStorage.setItem(sk, row.classList.contains('dismissed') ? '1':'0');
    });
  });
  panels.querySelectorAll('[data-clear]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.clear;
      panels.querySelectorAll(`.todo-row[data-key="${key}"].dismissed`).forEach(r=>r.remove());
    });
  });
}
function storeKey(key,idx){ return 'slacksummary-todo-'+key+'-'+idx; }

renderTabs();

// ---------- KPIs ----------
const KPIS = [
  {label:'Needs Action', accent:'var(--c-red)', num: NEEDS_ACTION.length, sub:[`${NEEDS_ACTION.filter(c=>c.badge==='urgent').length} urgent`, `${NEEDS_ACTION.filter(c=>c.badge==='pending').length} pending`], fill: NEEDS_ACTION.length},
  {label:'Monitoring', accent:'var(--c-blue)', num: MONITOR.length, sub:[`${MONITOR.filter(c=>c.badge==='done').length} resolving`, `${MONITOR.filter(c=>c.badge!=='done').length} ongoing`], fill: MONITOR.length},
  {label:'Highlights', accent:'var(--c-green)', num: HIGHLIGHTS.length, sub:['Wins & resolved items this week'], fill: HIGHLIGHTS.length},
  {label:'New Releases', accent:'var(--c-purple)', num: RELEASES.length, sub:['From #corp-product-announcements'], fill: RELEASES.length}
];
document.getElementById('kpiRow').innerHTML = KPIS.map(k=>{
  const segs = 8;
  const on = Math.min(segs, Math.max(1, k.fill));
  const bars = Array.from({length:segs},(_,i)=> `<span class="${i<on?'on':''}"></span>`).join('');
  return `<div class="kpi" style="--accent:${k.accent}">
    <div class="num">${k.num}</div>
    <div class="label">${k.label}</div>
    <div class="breakdown">${k.sub.join(' · ')}</div>
    <div class="fillbar">${bars}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
