<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Slack Summary</title>
<style>
  :root {
    color-scheme: light;
    --c-red: #D85A30; --c-red-bg: #FAECE7; --c-red-text: #712B13;
    --c-amber: #BA7517; --c-amber-bg: #FAEEDA; --c-amber-text: #633806;
    --c-green: #3B6D11; --c-green-bg: #EAF3DE; --c-green-text: #27500A;
    --c-blue: #185FA5; --c-blue-bg: #E6F1FB; --c-blue-text: #0C447C;
    --c-purple: #534AB7; --c-purple-bg: #EEEDFE; --c-purple-text: #3C3489;
    --c-teal: #0F6E56; --c-teal-bg: #E1F5EE; --c-teal-text: #085041;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f8f7f5;
    color: #2b2a28;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Topbar */
  .topbar {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 18px; flex-wrap: wrap; gap: 8px;
  }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .topbar .meta { text-align: right; font-size: 11px; color: #7a766f; line-height: 1.6; }
  .topbar .meta .range { font-weight: 600; color: #4a4740; font-size: 12px; }

  /* KPI cards */
  .kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px;
  }
  .kpi {
    background: #fff; border-radius: 8px; padding: 12px 14px;
    border-top: 3px solid var(--kpi-color, #999);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .kpi .num { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .kpi .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: #5a5750; margin-bottom: 6px; }
  .kpi .sub { font-size: 10.5px; color: #8a8680; line-height: 1.5; }
  .kpi .segbar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: #eee; }
  .kpi .segbar span { display: block; height: 100%; }

  /* Tabs */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
    border-bottom: 1px solid #e8e5df; padding-bottom: 10px;
  }
  .tab-btn {
    border: 1px solid #e2ded6; background: #fff; color: #55524c;
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .tab-btn:hover { background: #f2efe9; }
  .tab-btn.active { background: #2b2a28; color: #fff; border-color: #2b2a28; }
  .tab-btn .count { opacity: 0.7; font-weight: 500; margin-left: 3px; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-note {
    font-size: 12px; color: #8a8680; padding: 14px; background: #fff;
    border-radius: 8px; border: 1px dashed #ddd8ce;
  }

  /* Cards */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px;
  }
  .card {
    background: #fff; border-radius: 8px; padding: 10px 12px;
    border: 1px solid #ece8e0; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chan { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #8a8680; }
  .card-title { font-size: 12px; font-weight: 700; color: #2b2a28; margin: 2px 0 3px; line-height: 1.35; }
  .card-desc { font-size: 11px; color: #57544e; line-height: 1.5; margin-bottom: 8px; }
  .card-desc b { color: #2b2a28; }
  .card-bottom { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .badge.urgent { background: var(--c-red-bg); color: var(--c-red-text); }
  .badge.pending { background: var(--c-amber-bg); color: var(--c-amber-text); }
  .badge.watch { background: var(--c-amber-bg); color: var(--c-amber-text); }
  .badge.fyi { background: var(--c-blue-bg); color: var(--c-blue-text); }
  .badge.done { background: var(--c-green-bg); color: var(--c-green-text); }
  .badge.escalate { background: var(--c-purple-bg); color: var(--c-purple-text); }
  .backlink { font-size: 10.5px; color: #185FA5; text-decoration: none; font-weight: 600; }
  .backlink:hover { text-decoration: underline; }

  /* channel group headers for Highlights tab */
  .chan-group { margin-bottom: 16px; }
  .chan-group-h { font-size: 12.5px; font-weight: 700; color: #2b2a28; margin-bottom: 6px; display:flex; align-items:center; gap:6px; }

  /* To-Do tab */
  .todo-group { background: #fff; border-radius: 8px; border: 1px solid #ece8e0; margin-bottom: 12px; overflow: hidden; }
  .todo-group-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #f5f2ec; border-bottom: 1px solid #ece8e0;
  }
  .todo-group-h .title { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .chip { background: #e2ded6; color: #55524c; font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .clear-btn { font-size: 10.5px; color: #8a8680; background: none; border: none; cursor: pointer; font-weight: 600; text-decoration: underline; }
  .todo-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; font-size: 12px; border-bottom: 1px solid #f2efe9; cursor: pointer;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item:hover { background: #faf9f6; }
  .todo-item .txt { flex: 1; padding-right: 10px; }
  .todo-item.done .txt { text-decoration: line-through; color: #b3afa6; }
  .age { font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .age.overdue { color: var(--c-red); }
  .age.faded { color: #b3afa6; }
  .age.normal { color: #8a8680; }
  .empty-row { padding: 12px 14px; font-size: 11.5px; color: #b3afa6; font-style: italic; }
</style>
</head>

/* ---------------- RENDER HELPERS ---------------- */

const dotColor = { amber: "var(--c-amber)", blue: "var(--c-blue)", purple: "var(--c-purple)", green: "var(--c-green)", red: "var(--c-red)", teal: "var(--c-teal)" };

function badgeLabel(b) {
  return { urgent: "Urgent", pending: "Pending", watch: "Watch", fyi: "FYI", done: "Done", escalate: "Escalate?" }[b] || b;
}

function cardHtml(item) {
  const dot = dotColor[item.dot || "blue"] || "var(--c-blue)";
  const link = item.link ? `<a class="backlink" href="${item.link}" target="_blank" rel="noopener">Slack ↗</a>` : "";
  return `<div class="card">
    <div class="card-top"><span class="dot" style="background:${dot}"></span><span class="chan">${item.chan}</span></div>
    <div class="card-title">${item.title}</div>
    <div class="card-desc">${item.desc}</div>
    <div class="card-bottom"><span class="badge ${item.badge}">${badgeLabel(item.badge)}</span>${link}</div>
  </div>`;
}

function simpleCardHtml(item) {
  return `<div class="card">
    <div class="card-title">${item.title}</div>
    <div class="card-desc">${item.desc}</div>
    <div class="card-bottom"><span class="badge ${item.badge}">${badgeLabel(item.badge)}</span></div>
  </div>`;
}

function channelCardHtml(item) {
  const link = item.link ? `<a class="backlink" href="${item.link}" target="_blank" rel="noopener">Slack ↗</a>` : "";
  return `<div class="card">
    <div class="card-top"><span class="dot" style="background:var(--c-teal)"></span><span class="chan">${item.name}</span></div>
    <div class="card-desc">${item.desc}</div>
    <div class="card-bottom"><span></span>${link}</div>
  </div>`;
}

function renderCards(arr, mapFn) {
  if (!arr.length) return `<div class="section-note">Nothing to flag today.</div>`;
  return `<div class="cards">${arr.map(mapFn).join("")}</div>`;
}

function renderHighlights() {
  if (!highlights.length) return `<div class="section-note">Nothing to flag today.</div>`;
  return highlights.map(g => `
    <div class="chan-group">
      <div class="chan-group-h"><span class="dot" style="background:var(--c-teal)"></span>${g.group}</div>
      <div class="cards">${g.items.map(cardHtml.bind(null)).map((h,i)=>h.replace('<div class="card-top">.*?</div>','')).join("")}</div>
    </div>`).join("");
}

// Highlights cards don't repeat channel name inline since it's grouped — use lighter card
function highlightItemCard(item) {
  const link = item.link ? `<a class="backlink" href="${item.link}" target="_blank" rel="noopener">Slack ↗</a>` : "";
  return `<div class="card">

    <div class="card-bottom"><span class="badge ${item.badge}">${badgeLabel(item.badge)}</span>${link}</div>

}

function renderHighlightsFixed() {

  return highlights.map(g => `

/* ---------------- TO-DO TAB ---------------- */

const DISMISS_KEY = "slackSummaryDismissedTodos";
function getDismissed() {
  try { return JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]"); } catch(e) { return []; }
}
function setDismissed(arr) { localStorage.setItem(DISMISS_KEY, JSON.stringify(arr)); }

function ageBadge(days) {
  if (days === null || days === undefined) return `<span class="age normal">—</span>`;
  if (days <= 2) return `<span class="age overdue">${days}d</span>`;
  if (days > 5) return `<span class="age faded">${days}d</span>`;
  return `<span class="age normal">${days}d</span>`;
}

function renderTodoGroups() {
  if (todoUnavailable) {
    return `<div class="section-note">Obsidian vault wasn't reachable during this run (Daily Tasks.md / Personal To Do.md not accessible from the automation), so to-dos couldn't be pulled this time. Re-run once vault access is restored.</div>`;
  }
  const dismissed = getDismissed();
  return todoGroups.map(g => {
    const visible = g.items.filter(it => !dismissed.includes(it.id));
    const rows = visible.length
      ? visible.map(it => `
        <div class="todo-item" data-id="${it.id}">
          <span class="txt">${it.text}</span>
          ${ageBadge(it.days)}
        </div>`).join("")
      : `<div class="empty-row">Nothing here.</div>`;
    return `<div class="todo-group" data-group="${g.key}">
      <div class="todo-group-h">
        <span class="title">${g.title} <span class="chip">${visible.length}</span></span>
        <button class="clear-btn" data-clear="${g.key}">Clear done</button>
      </div>
      ${rows}
    </div>`;
  }).join("");
}

function wireTodoInteractions() {
  document.querySelectorAll(".todo-item").forEach(row => {
    row.addEventListener("click", () => {
      row.classList.toggle("done");
    });
  });
  document.querySelectorAll("[data-clear]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const key = btn.getAttribute("data-clear");
      const group = todoGroups.find(g => g.key === key);
      if (!group) return;
      const doneIds = Array.from(document.querySelectorAll(`.todo-group[data-group="${key}"] .todo-item.done`))
        .map(el => el.getAttribute("data-id"));
      const dismissed = getDismissed();
      const merged = Array.from(new Set([...dismissed, ...doneIds]));
      setDismissed(merged);
      renderAll();
    });
  });
}

/* ---------------- TABS ---------------- */

const tabs = [
  { id: "needs-action", label: "Needs Action", count: needsAction.length },
  { id: "monitor", label: "Monitor", count: monitor.length },
  { id: "highlights", label: "Highlights", count: highlights.reduce((a,g)=>a+g.items.length,0) },
  { id: "saved", label: "Saved Threads", count: savedThreads.length },
  { id: "buzz", label: "Buzz Topics", count: buzzTopics.length },
  { id: "releases", label: "Releases", count: releases.length },
  { id: "new-channels", label: "New Channels", count: newChannels.length },
  { id: "todo", label: "☑ To-Do", count: null }
];

function renderTabBar(active) {
  document.getElementById("tabBar").innerHTML = tabs.map(t => `
    <button class="tab-btn ${t.id === active ? 'active' : ''}" data-tab="${t.id}">
      ${t.label}${t.count !== null ? `<span class="count">${t.count}</span>` : ""}
    </button>`).join("");
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.getAttribute("data-tab");
      renderAll();
    });
  });
}

function renderPanels(active) {
  const panelsHtml = `
    <div class="tab-panel ${active==='needs-action'?'active':''}" id="panel-needs-action">${renderCards(needsAction, cardHtml)}</div>
    <div class="tab-panel ${active==='monitor'?'active':''}" id="panel-monitor">${renderCards(monitor, cardHtml)}</div>
    <div class="tab-panel ${active==='highlights'?'active':''}" id="panel-highlights">${renderHighlightsFixed()}</div>
    <div class="tab-panel ${active==='saved'?'active':''}" id="panel-saved">${renderCards(savedThreads, cardHtml)}</div>
    <div class="tab-panel ${active==='buzz'?'active':''}" id="panel-buzz">${renderCards(buzzTopics, simpleCardHtml)}</div>
    <div class="tab-panel ${active==='releases'?'active':''}" id="panel-releases">${renderCards(releases, simpleCardHtml)}</div>
    <div class="tab-panel ${active==='new-channels'?'active':''}" id="panel-new-channels">${renderCards(newChannels, channelCardHtml)}</div>
    <div class="tab-panel ${active==='todo'?'active':''}" id="panel-todo">${renderTodoGroups()}</div>
  `;
  document.getElementById("panels").innerHTML = panelsHtml;
  wireTodoInteractions();
}

let activeTab = "needs-action";

function renderKpis() {
  const monitorCount = monitor.length;
  const highlightCount = highlights.reduce((a,g)=>a+g.items.length,0);
  const releaseCount = releases.length;
  const kpis = [
    { label: "Needs Action", num: needsAction.length, color: "var(--c-red)",
      sub: `${needsAction.filter(i=>i.badge==='pending').length} pending · ${needsAction.filter(i=>i.badge==='watch').length} watch`,
      segs: [{c:"var(--c-red)", w:60},{c:"var(--c-amber)", w:40}] },
    { label: "Monitoring", num: monitorCount, color: "var(--c-amber)",
      sub: `${monitor.filter(i=>i.badge==='watch').length} watch · ${monitor.filter(i=>i.badge==='pending').length} pending`,
      segs: [{c:"var(--c-amber)", w:100}] },
    { label: "Highlights", num: highlightCount, color: "var(--c-teal)",
      sub: `${highlights.length} channels active this week`,
      segs: [{c:"var(--c-teal)", w:100}] },
    { label: "New Releases", num: releaseCount, color: "var(--c-blue)",
      sub: `From #corp-product-announcements`,
      segs: [{c:"var(--c-blue)", w:100}] }
  ];
  document.getElementById("kpiRow").innerHTML = kpis.map(k => `
    <div class="kpi" style="--kpi-color:${k.color}">
      <div class="num">${k.num}</div>
      <div class="label">${k.label}</div>
      <div class="sub">${k.sub}</div>
      <div class="segbar">${k.segs.map(s=>`<span style="width:${s.w}%;background:${s.c}"></span>`).join("")}</div>
    </div>`).join("");
}

function renderAll() {
  renderTabBar(activeTab);
  renderPanels(activeTab);
}

function setDateHeader() {
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - 6);
  const fmt = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  document.getElementById("dateRange").textContent = `${fmt(start)} – ${fmt(now)}`;
  document.getElementById("refreshed").textContent = `Refreshed ${now.toLocaleDateString(undefined,{month:"short",day:"numeric"})} ${now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}`;
}

setDateHeader();
renderKpis();
renderAll();
</script>
</body>
</html>
